name: build-ios

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "MLBBServerPicker/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    name: Build unsigned ipa
    runs-on: macos-15
    env:
      SCHEME: MLBBServerPicker
      BUNDLE_ID: com.nyx.mlabb.serverpicker

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: MLBBServerPicker
        run: xcodegen generate

      # Unsigned on purpose: signing happens locally in GBox Esign with your
      # own certificate, so the artifact carries no secrets and no Apple creds
      # ever enter CI.
      - name: Build
        working-directory: MLBBServerPicker
        run: |
          set -o pipefail
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build \
            | xcpretty || exit $?

      - name: Package ipa
        working-directory: MLBBServerPicker
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/${SCHEME}.app"
          test -d "${APP_PATH}"

          rm -rf Payload "${SCHEME}.ipa"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/

          # Strip the embedded stub signature left by the unsigned build.
          rm -rf "Payload/${SCHEME}.app/_CodeSignature"
          if [ -f "Payload/${SCHEME}.app/embedded.mobileprovision" ]; then
            rm -f "Payload/${SCHEME}.app/embedded.mobileprovision"
          fi

          zip -qry "${SCHEME}.ipa" Payload
          rm -rf Payload
          ls -lh "${SCHEME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${SCHEME}-ipa
          path: MLBBServerPicker/${SCHEME}.ipa
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MLBBServerPicker/${SCHEME}.ipa