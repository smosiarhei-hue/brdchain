name: build-ios

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MLBBServerPicker/**"
      - ".github/workflows/build-ios.yml"
    tags:
      - "v*"

jobs:
  build:
    name: Build unsigned ipa
    runs-on: macos-15
    permissions:
      contents: write

    env:
      SCHEME: MLBBServerPicker

    steps:
      - uses: actions/checkout@v4

      # Do not pin a version. The image ships several Xcodes and the newest
      # simulator runtimes; an older pinned Xcode can fail with
      # "No simulator runtime version ... available to use with
      # iphonesimulator SDK version ..." even when building for a device.
      # Highest non-beta release wins.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                 | grep -v -i beta \
                 | sort -V \
                 | tail -1)
          if [ -z "${XCODE}" ]; then
            echo "::error::no Xcode found under /Applications"
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          echo "Using ${XCODE}"
          sudo xcode-select -s "${XCODE}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: MLBBServerPicker
        run: xcodegen generate

      # Unsigned on purpose: signing happens locally in GBox Esign with your
      # own certificate, so the artifact carries no secrets and no Apple creds
      # ever enter CI.
      #
      # No `set -o pipefail` here on purpose. The raw xcodebuild log is what
      # matters when a build fails, and filtering it through xcpretty only
      # makes diagnosis harder.
      - name: Build
        working-directory: MLBBServerPicker
        run: |
          # pipefail is required here and safe: without it the pipeline reports
          # tee's exit status and a failed build would pass as a green step.
          set -o pipefail
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build 2>&1 | tee build.log

      # Job logs need auth to read through the API, but annotations do not.
      # Mirroring the compiler errors into workflow commands means a failing
      # build can be diagnosed from the check-runs endpoint alone.
      - name: Surface compiler errors as annotations
        if: failure()
        working-directory: MLBBServerPicker
        run: |
          if [ ! -f build.log ]; then
            echo "::error::build.log was never written — the step failed before xcodebuild ran"
            exit 0
          fi
          grep -E '(error|warning):' build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//'%'/'%25'}"
          done || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package ipa
        working-directory: MLBBServerPicker
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/${SCHEME}.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::app bundle missing at ${APP_PATH} — the build step above did not produce one"
            ls -R build/Build/Products 2>/dev/null || true
            exit 1
          fi

          rm -rf Payload "${SCHEME}.ipa"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/

          # The unsigned build leaves no signature directory, but clear it if a
          # future config does produce one — a stale stub breaks Esign.
          rm -rf "Payload/${SCHEME}.app/_CodeSignature"
          rm -f "Payload/${SCHEME}.app/embedded.mobileprovision"

          zip -qry "${SCHEME}.ipa" Payload
          rm -rf Payload
          ls -lh "${SCHEME}.ipa"

          # Fail here rather than letting a missing ipa reach upload-artifact,
          # which only warns and would leave the run green with nothing
          # actually published.
          test -s "${SCHEME}.ipa"

      # `${SCHEME}` is shell syntax and only expands inside `run:`. Action
      # `with:` blocks need `${{ env.SCHEME }}` instead — with the wrong one
      # upload-artifact silently publishes nothing, since a missing path is
      # only a warning and the run still goes green.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-ipa
          path: MLBBServerPicker/${{ env.SCHEME }}.ipa
          retention-days: 30
          if-no-files-found: error

      # Every run publishes to a release, not just tagged ones. Artifacts
      # expire after 30 days and live behind the Actions UI, so a signed ipa
      # that only exists there is easy to lose. The rolling 'latest' release
      # is the single place to look; a tagged build gets its own release too.
      - name: Publish to rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            Unsigned build of MLBB Server Picker.

            Sign `MLBBServerPicker.ipa` locally in GBox Esign with your own
            Apple Development certificate. No Apple credentials exist in CI.

            Commit: `${{ github.sha }}`
          fail_on_unmatched_files: true
          files: MLBBServerPicker/${{ env.SCHEME }}.ipa

      # The bot token is a secret in repository settings, never in the repo.
      # The repository is public, so a token committed anywhere here would let
      # anyone drive the bot. Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under
      # Settings -> Secrets and variables -> Actions; the step skips itself
      # while they are unset.
      - name: Send ipa to Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          FILE="MLBBServerPicker/${SCHEME}.ipa"
          CAPTION="MLBB Server Picker ${SHORT_SHA} — unsigned, sign in GBox Esign. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest"

          # Kept on one line on purpose: a multi-line caption inside a YAML
          # scalar needs continuation lines indented past the key, and getting
          # that wrong fails to parse the whole workflow file.
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${FILE};filename=${SCHEME}-${SHORT_SHA}.ipa" \
            -F "caption=${CAPTION}" 2>&1) || {
              echo "::error::telegram upload failed: ${RESPONSE}"
              exit 1
            }

          echo "sent to chat ${TELEGRAM_CHAT_ID}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: MLBBServerPicker/${{ env.SCHEME }}.ipa