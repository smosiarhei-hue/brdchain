name: build-ios

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MLBBServerPicker/**"
      - ".github/workflows/build-ios.yml"
    tags:
      - "v*"

jobs:
  build:
    name: Build unsigned ipa
    runs-on: macos-15
    permissions:
      contents: write

    env:
      SCHEME: MLBBServerPicker

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: MLBBServerPicker
        run: xcodegen generate

      # Unsigned on purpose: signing happens locally in GBox Esign with your
      # own certificate, so the artifact carries no secrets and no Apple creds
      # ever enter CI.
      #
      # No `set -o pipefail` here on purpose. The raw xcodebuild log is what
      # matters when a build fails, and filtering it through xcpretty only
      # makes diagnosis harder.
      - name: Build
        working-directory: MLBBServerPicker
        run: |
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build

      - name: Package ipa
        working-directory: MLBBServerPicker
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/${SCHEME}.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::app bundle missing at ${APP_PATH} — the build step above did not produce one"
            ls -R build/Build/Products 2>/dev/null || true
            exit 1
          fi

          rm -rf Payload "${SCHEME}.ipa"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/

          # The unsigned build leaves no signature directory, but clear it if a
          # future config does produce one — a stale stub breaks Esign.
          rm -rf "Payload/${SCHEME}.app/_CodeSignature"
          rm -f "Payload/${SCHEME}.app/embedded.mobileprovision"

          zip -qry "${SCHEME}.ipa" Payload
          rm -rf Payload
          ls -lh "${SCHEME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${SCHEME}-ipa
          path: MLBBServerPicker/${SCHEME}.ipa
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MLBBServerPicker/${SCHEME}.ipa